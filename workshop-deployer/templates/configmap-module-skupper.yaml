kind: ConfigMap
apiVersion: v1
metadata:
  name: module-skupper
data:
  module-skupper.json: |
    {
      "apiVersion": "argoproj.io/v1alpha1",
      "kind": "Application",
      "metadata": {
        "name": "{{ .Values.module.module_skupper.name }}",
        "namespace": "{{ .Values.module.module_skupper.namespace }}",
        "finalizers": [
          "resources-finalizer.argocd.argoproj.io/foreground"
        ]
      },
      "spec": {
        "destination": {
          "name": "",
          "namespace": "{{ .Values.module.module_skupper.destination.namespace }}",
          "server": "https://kubernetes.default.svc"
        },
        "project": "default",
        "syncPolicy": {
          "automated": {
            "prune": false,
            "selfHeal": false
          }
        },
        "source": {
          "repoURL": "{{ .Values.module.module_skupper.source.repoUrl }}",
          "targetRevision": "{{ .Values.module.module_skupper.source.targetRevision }}",
          "path": "{{ .Values.module.module_skupper.source.path }}",
          "helm": {
            "valuesObject": {
              "globex-db-secret": {
                "pgsql": {
                  "adminPassword": "adminpassword"
                }
              },
              "globex-db": {
                "pgsql": {
                  "adminPassword": "adminpassword"
                },
                "service": {
                  "enabled": false
                },
                "namespace": "globex-skupper-db-{{ .Values.variable.user }}"
              },
              "networkpolicy": {
                "enabled": true,
                "namespace": "globex-skupper-db-{{ .Values.variable.user }}"
              },
              "globex-web": {
                "sso": {
                  "url": "https://sso.{{ .Values.openshift.domain }}/realms/globex-{{ .Values.variable.user }}",
                  "client": "globex-web-gateway",
                  "logoutUri": "https://globex-web-{{ .Values.module.module_skupper.destination.namespace }}.{{ .Values.openshift.domain }}/home"
                }
              }
            }
          }
        }
      }
    }