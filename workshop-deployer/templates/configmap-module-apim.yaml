kind: ConfigMap
apiVersion: v1
metadata:
  name: module-apim
data:
  module-apim.json: |
    {
      "apiVersion": "argoproj.io/v1alpha1",
      "kind": "Application",
      "metadata": {
        "name": "{{ .Values.module.module_apim.name }}",
        "namespace": "{{ .Values.module.module_apim.namespace }}",
        "finalizers": [
          "resources-finalizer.argocd.argoproj.io/foreground"
        ]
      },
      "spec": {
        "destination": {
          "name": "",
          "namespace": "{{ .Values.module.module_apim.destination.namespace }}",
          "server": "https://kubernetes.default.svc"
        },
        "project": "default",
        "syncPolicy": {
          "automated": {
            "prune": false,
            "selfHeal": false
          }
        },
        "source": {
          "repoURL": "{{ .Values.module.module_apim.source.repoUrl }}",
          "targetRevision": "{{ .Values.module.module_apim.source.targetRevision }}",
          "path": "{{ .Values.module.module_apim.source.path }}",
          "helm": {
            "valuesObject": {
              "globex-partner-gateway": {
                "globexStoreApp": {
                  "url": "http://globex-store-app.globex-{{ .Values.variable.user }}.svc.cluster.local:8080"
                }
              },
              "globex-mobile-gateway": {
                "globexStoreApp": {
                  "url": "http://globex-store-app.globex-{{ .Values.variable.user }}.svc.cluster.local:8080"
                },
                "keycloak": {
                  "authserver": "https://sso.{{ .Values.openshift.domain }}/realms/globex-{{ .Values.variable.user }}"
                }
              },
              "service-registry": {
                "service-registry": {
                  "app": {
                    "route": {
                      "host": "service-registry-app-{{ .Values.variable.user }}.{{ .Values.openshift.domain }}"
                    }
                  },
                  "ui": {
                    "route": {
                      "host": "service-registry-ui-{{ .Values.variable.user }}.{{ .Values.openshift.domain }}"
                    }
                  }
                }
              }
            }
          }
        }
      }
    }

